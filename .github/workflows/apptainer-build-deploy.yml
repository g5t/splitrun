name: Apptainer Build Deploy

on:
  pull_request:
  push:
    branches: main

jobs:
  build-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    container:
      image: quay.io/singularity/singularity:v4.3.1
      options: --privileged
    name: Build and Deploy 'Tainer
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build
        run: |
          cd apptainer
          singularity build splitrun.sif splitrun.def

      - name: Deploy
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | singularity remote login -u ${{ secrets.GHCR_USERNAME }} --password-stdin oras:://ghcr.io
          singularity push apptainer/splitrun.cif oras::/ghcr.io/${GITHUB_REPOSITORY}:${tag}
